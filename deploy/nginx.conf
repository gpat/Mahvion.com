        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}

# ---------- Medscribe ----------
# NOT DEPLOYED. Nothing listens on 3002, so this block redirects to the product
# page rather than quietly serving a different product (which is what happens
# today: med.mahvion.com currently returns the Vehicle ERP app).
server {
    listen 80;
    listen [::]:80;
    server_name med.mahvion.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name med.mahvion.com;

    ssl_certificate     /etc/letsencrypt/live/med.mahvion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/med.mahvion.com/privkey.pem;

    # Until the app ships, send visitors to the product page instead of a 502.
    # Delete this and uncomment the location block below when med goes live.
    return 302 https://mahvion.com/products#medscribe;

