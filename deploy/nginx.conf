# /etc/nginx/sites-available/mahvion.com
# Landing site + subdomain routing to other SaaS apps
# Replace ports (3001-3004) with the actual ports of each app

# ---------- Main landing ----------
server {
    listen 80;
    server_name mahvion.com www.mahvion.com;
    return 301 https://mahvion.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mahvion.com www.mahvion.com;

    ssl_certificate     /etc/letsencrypt/live/mahvion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahvion.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Next.js static assets long-cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------- Vehicle ERP ----------
