# /etc/nginx/sites-available/mahvion.com
# Landing site + subdomain routing to other SaaS apps
#
# App ports:
#   3000  mahvion.com        landing (this repo, Next.js / PM2)
#   3001  erp.mahvion.com    Vehicle ERP (Next.js)
#   3002  med.mahvion.com    Medscribe — NOT DEPLOYED YET
#   3003  ins.mahvion.com    BimaDesk insurance (Flask + gunicorn, docker compose)
#   3004  real.mahvion.com   Real Estate (RealState app)
#
# Before replacing the live config, diff it against what is actually running:
#   sudo nginx -T > /tmp/live-nginx.conf
# The repo copy has drifted from the server in the past.

# TLS: each host has its own Let's Encrypt lineage in /etc/letsencrypt/live/
# (mahvion.com, erp, ins, med, real — plus leadscrm, which is another app on
# the same VM and is not served by this file). Each block points at its own.
# Verify before reloading; a missing cert path stops nginx from starting:
#   sudo certbot certificates
#
# The proxy_set_header blocks are repeated per server rather than factored into
# a snippet, so this file drops in without extra includes.

# ---------- Catch-all: unknown/undeployed hosts ----------
# Without this, a request for any *.mahvion.com host that has no block of its
# own falls through to whichever server block nginx considers default for the
# port — which is how med.mahvion.com ended up serving the Vehicle ERP app.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Any valid cert works here; the connection is refused right after the
    # handshake. Point it at the landing cert.
    ssl_certificate     /etc/letsencrypt/live/mahvion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahvion.com/privkey.pem;

    return 444;
}

# ---------- Main landing ----------
server {
    listen 80;
    listen [::]:80;
    server_name mahvion.com www.mahvion.com;

    # Keep certbot's HTTP-01 challenge reachable.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mahvion.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mahvion.com www.mahvion.com;

    ssl_certificate     /etc/letsencrypt/live/mahvion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahvion.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Next.js static assets long-cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------- Vehicle ERP ----------
