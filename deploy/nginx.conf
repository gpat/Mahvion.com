# ---------- Insurance — BimaDesk (Flask + gunicorn on docker compose) ----------
server {
    listen 80;
    listen [::]:80;
    server_name ins.mahvion.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ins.mahvion.com;

    ssl_certificate     /etc/letsencrypt/live/ins.mahvion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ins.mahvion.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # The client import endpoint accepts .xlsx uploads (routes/api.py parses
    # them with openpyxl). nginx's 1 MB default would 413 them.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        # Matches the gunicorn --timeout 120 in the BimaDesk Dockerfile, so
        # nginx and the app give up at the same time instead of nginx
        # reporting 504 on a request the worker is still serving.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }
}

